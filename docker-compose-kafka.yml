version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gittrend-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - gittrend-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      sleep 15
      kafka-topics --create --if-not-exists --topic github-api --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092
      kafka-topics --create --if-not-exists --topic github-rss --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092
      echo 'Topics created!'
      kafka-topics --list --bootstrap-server kafka:29092
      "
    networks:
      - gittrend-net

  producer-api:
    build:
      context: ./kafka
      dockerfile: Dockerfile.producer
    container_name: producer-api
    depends_on:
      - kafka
      - kafka-init
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GITHUB_PAT: ""
      PYTHONUNBUFFERED: "1"
    command: ["python", "producer_api.py"]
    restart: unless-stopped
    networks:
      - gittrend-net

  producer-rss:
    build:
      context: ./kafka
      dockerfile: Dockerfile.producer
    container_name: producer-rss
    depends_on:
      - kafka
      - kafka-init
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      PYTHONUNBUFFERED: "1"
    command: ["python", "producer_rss.py"]
    restart: unless-stopped
    networks:
      - gittrend-net

  consumer-hdfs:
    build:
      context: ./kafka
      dockerfile: Dockerfile.producer
    container_name: consumer-hdfs
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      HDFS_URL: http://namenode:9870
      PYTHONUNBUFFERED: "1"
    command: ["python", "consumer_to_hdfs.py"]
    restart: unless-stopped
    volumes:
      - ./dashboard/data:/app/data
    networks:
      - gittrend-net

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile.spark
    container_name: spark
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      HDFS_NAMENODE: namenode:9000
    restart: unless-stopped
    volumes:
      - ./dashboard/data:/app/data
      - ./lakehouse:/app/lakehouse
    networks:
      - gittrend-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./dashboard/data:/app/data
    restart: unless-stopped
    networks:
      - gittrend-net

  lakehouse-dashboard:
    build:
      context: ./lakehouse
      dockerfile: Dockerfile.lakehouse
    container_name: lakehouse-dashboard
    ports:
      - "5001:5001"
    volumes:
      - ./lakehouse/lakehouse_data:/app/lakehouse/lakehouse_data
      - ./lakehouse/app_gold.py:/app/app_gold.py
      - ./dashboard/data:/app/data
    restart: unless-stopped
    networks:
      - gittrend-net

  # Service baru: pipeline Bronze->Silver->Gold jalan otomatis setiap 10 menit
  lakehouse-pipeline:
    build:
      context: ./lakehouse
      dockerfile: Dockerfile.lakehouse
    container_name: lakehouse-pipeline
    depends_on:
      - spark
      - consumer-hdfs
    environment:
      HDFS_NAMENODE: namenode:9000
      PYTHONUNBUFFERED: "1"
    command: >
      bash -c "pip install delta-spark==3.1.0 importlib_metadata &&
               echo '[pipeline] Menunggu 60 detik agar HDFS dan data siap...' &&
               sleep 60 &&
               while true; do
                 echo '[pipeline] Mulai run Bronze...' &&
                 python3 /app/lakehouse/01_bronze.py &&
                 echo '[pipeline] Mulai run Silver...' &&
                 python3 /app/lakehouse/02_silver.py &&
                 echo '[pipeline] Mulai run Gold...' &&
                 python3 /app/lakehouse/03_gold.py &&
                 echo '[pipeline] Selesai! Tunggu 10 menit...' &&
                 sleep 600
               done"
    volumes:
      - ./lakehouse:/app/lakehouse
    restart: unless-stopped
    networks:
      - gittrend-net
networks:
  gittrend-net:
    external: true
